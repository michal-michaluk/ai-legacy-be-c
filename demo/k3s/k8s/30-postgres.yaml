apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: otel-mqtt-demo
data:
  # Schema, applied once by the db-migrate Job (never by the app at startup,
  # D1/D11). Mirrors demo/k3s/services/settings-service/migrations.
  0001_create_settings.sql: |
    CREATE TABLE settings (
        id         BIGSERIAL   PRIMARY KEY,
        tenant     TEXT        NOT NULL,
        "user"     TEXT,
        key        TEXT        NOT NULL,
        value      JSONB       NOT NULL,
        version    INTEGER     NOT NULL DEFAULT 1,
        updated_at BIGINT      NOT NULL
    );
    CREATE UNIQUE INDEX ux_settings_identity ON settings (tenant, COALESCE("user", ''), key);
    CREATE INDEX idx_settings_tenant_key ON settings (tenant, key);
  0002_add_created_at.sql: |
    ALTER TABLE settings ADD COLUMN created_at BIGINT;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: otel-mqtt-demo
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: otel-mqtt-demo
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: demo
            - name: POSTGRES_PASSWORD
              value: demo
            - name: POSTGRES_DB
              value: demo
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "demo", "-d", "demo"]
            initialDelaySeconds: 5
            periodSeconds: 3
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
      volumes:
        - name: pg-data
          emptyDir: {}
