apiVersion: v1
kind: Service
metadata:
  name: openobserve
  namespace: otel-mqtt-demo
  labels:
    app: openobserve
spec:
  selector:
    app: openobserve
  ports:
    - name: http
      port: 5080
      targetPort: 5080
    - name: grpc
      port: 5081
      targetPort: 5081
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openobserve
  namespace: otel-mqtt-demo
  labels:
    app: openobserve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openobserve
  template:
    metadata:
      labels:
        app: openobserve
    spec:
      containers:
        - name: openobserve
          # Single Rust binary (traces + logs + metrics) with a built-in web UI.
          image: openobserve/openobserve:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ZO_ROOT_USER_EMAIL
              value: admin@demo.local
            - name: ZO_ROOT_USER_PASSWORD
              value: "Complexpass#123"
            - name: ZO_DATA_DIR
              value: /data
          ports:
            - containerPort: 5080
            - containerPort: 5081
          readinessProbe:
            httpGet:
              path: /web/
              port: 5080
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
      volumes:
        - name: data
          emptyDir: {}
